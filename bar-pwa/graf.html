<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Chart.js JSON Diagram</title>
    <!-- Chart.js betöltése CDN-en keresztül -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.js"></script>

</head>
<body>

    <div style="width: 80%; max-width: 1000px; margin: 0 auto;">
        <!-- Ide ágyazódik be a diagram -->
        <canvas id="myChart"></canvas>
    </div>

    <script>
        // 1. JSON fájl beolvasása aszinkron módon
        fetch('https://huggingface.co/datasets/ocsi66/bar-stand-data/raw/main/bottles.json')
    .then(response => response.json())
    .then(jsonData => {
        // 1. ADATOK ÁTALAKÍTÁSA: Kigyűjtjük az összes nevet és pct értéket külön listákba
        const uvegNevek = jsonData.map(item => item.name);
        const szazalekErtekek = jsonData.map(item => item.pct);

        // 2. A diagram kirajzolása az új listákkal
        const ctx = document.getElementById('myChart').getContext('2d');
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: uvegNevek, // Az X tengelyre az italok nevei kerülnek
                datasets: [{
                    label: 'Üvegek töltöttsége (%)',
                    data: szazalekErtekek, // Az Y tengelyre a pct számok kerülnek
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100 // Mivel ez százalék (pct), fixálhatjuk a tetejét 100-ra
                    }
                }
            }
        });
    })
    .catch(error => console.error('Hiba:', error));

    </script>
</body>
</html>
