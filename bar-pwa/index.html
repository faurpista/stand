<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e8a820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BárLeltár">
<title>Bár Leltár</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0a08; --surface: #1a1410; --card: #211a14; --border: rgba(255,200,80,0.12);
  --gold: #e8a820; --gold-light: #f5c842; --amber: #c46a0a;
  --text: #f0e6d0; --muted: #7a6a55;
  --danger: #c0392b; --warn: #e67e22; --ok: #27ae60;
  --font-head: 'Bebas Neue', sans-serif; --font-body: 'DM Sans', sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-body);
  display: flex; flex-direction: column;
}

/* ── NOISE ── */
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.35;
}

/* ── LAYOUT ── */
#app { position:relative; z-index:1; display:flex; flex-direction:column; height:100%; padding-top: var(--safe-top); }

/* ── HEADER ── */
header {
  flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding: 12px 16px 10px; border-bottom: 1px solid var(--border);
  background: rgba(13,10,8,0.95); backdrop-filter: blur(10px);
}
.logo { font-family: var(--font-head); font-size: 26px; letter-spacing: 2px; color: var(--gold); line-height:1; }
.logo span { color: var(--muted); font-size: 11px; font-family: var(--font-body); display:block; letter-spacing:0.05em; }
.header-right { display:flex; gap:8px; align-items:center; }
#api-indicator { width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background 0.3s; }
#api-indicator.ok { background:var(--ok); }
#api-indicator.err { background:var(--danger); }
.icon-btn {
  width:36px; height:36px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:border-color 0.15s;
}
.icon-btn:hover { border-color: var(--gold); color: var(--gold); }

/* ── NAV TABS ── */
.tabs {
  flex-shrink:0; display:flex; border-bottom: 1px solid var(--border);
  background: rgba(13,10,8,0.95);
}
.tab {
  flex:1; padding:10px 4px; font-family:var(--font-head); font-size:14px; letter-spacing:1px;
  color:var(--muted); text-align:center; cursor:pointer; border-bottom:2px solid transparent;
  transition:all 0.15s; user-select:none;
}
.tab.active { color:var(--gold); border-bottom-color:var(--gold); }

/* ── PAGES ── */
.page { display:none; flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding-bottom: calc(16px + var(--safe-bot)); }
.page.active { display:flex; flex-direction:column; }

/* ── STATS BAR ── */
.stats-bar {
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
  padding:12px 12px 0; flex-shrink:0;
}
.stat { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
.stat-val { font-family:var(--font-head); font-size:24px; color:var(--gold); line-height:1; }
.stat-label { font-size:10px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:0.06em; }

/* ── TOOLBAR ── */
.toolbar { display:flex; gap:8px; padding:10px 12px; flex-shrink:0; flex-wrap:wrap; }
.toolbar input, .toolbar select {
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  font-family:var(--font-body); font-size:13px; padding:7px 10px; border-radius:6px;
  outline:none; transition:border-color 0.2s;
}
.toolbar input { flex:1; min-width:100px; }
.toolbar input::placeholder { color:var(--muted); }
.toolbar input:focus, .toolbar select:focus { border-color:var(--gold); }
.btn {
  background:var(--gold); color:#1a1000; font-family:var(--font-head); font-size:15px;
  letter-spacing:1px; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;
  transition:background 0.15s, transform 0.1s; white-space:nowrap;
}
.btn:hover { background:var(--gold-light); }
.btn:active { transform:scale(0.97); }
.btn.sec {
  background:transparent; color:var(--muted); border:1px solid var(--border);
  font-family:var(--font-body); font-size:13px; font-weight:500; letter-spacing:0;
}
.btn.sec:hover { color:var(--text); border-color:var(--muted); }

/* ── BOTTLE GRID ── */
.bottles-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
  gap:12px; padding:0 12px 12px;
}
.bottle-card {
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:14px 12px 12px; position:relative; transition:border-color 0.2s, transform 0.15s;
  cursor:pointer; user-select:none;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translateZ(0); /* Aktiválja a 3D gyorsítást, ami élesen tartja a textúrát */
  will-change: transform; /* Jelzi a böngészőnek, hogy optimalizáljon */
}
.bottle-card:hover { border-color:rgba(232,168,32,0.35); transform:translateY(-2px); }
.bottle-card.low { border-color:rgba(192,57,43,0.4); }
.bottle-card.warn { border-color:rgba(230,126,34,0.4); }
.bottle-visual { width:40px; margin:0 auto 10px; }
.bottle-svg { 
  width:40px; 
  width: 100%;
  height: auto;
  display: block;
  /* Kényszeríti a böngészőt, hogy vektorként, élesen rajzolja újra */
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
}
.bottle-name { font-family:var(--font-head); font-size:16px; color:var(--text); text-align:center; margin-bottom:2px; line-height:1.1; }
.bottle-cat { font-size:10px; color:var(--muted); text-align:center; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.06em; }
.fill-row { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.fill-track { flex:1; height:5px; background:rgba(255,255,255,0.06); border-radius:3px; overflow:hidden; }
.fill-bar { 
  
  height: 100%;
  border-radius: 3px;
  transition: width 0.4s ease;
  transform: translateZ(0); /* Ez itt is csodákra képes a csíkoknál */
}
.fill-pct { font-size:12px; font-weight:500; min-width:30px; text-align:right; }
.vol-display { font-size:11px; color:var(--muted); text-align:center; margin-bottom:8px; }
.vol-display strong { color:var(--text); }
.adj-row { display:flex; align-items:center; justify-content:center; gap:5px; }
.adj-btn {
  width:26px; height:26px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all 0.15s; line-height:1;
}
.adj-btn:hover { background:rgba(232,168,32,0.15); border-color:var(--gold); color:var(--gold); }
.pct-input {
  width:44px; text-align:center; background:var(--surface); border:1px solid var(--border);
  color:var(--text); font-family:var(--font-body); font-size:12px; font-weight:500;
  padding:3px 4px; border-radius:5px; outline:none;
}
.pct-input:focus { border-color:var(--gold); }
.status-dot { width:7px; height:7px; border-radius:50%; position:absolute; top:9px; right:9px; }
.del-btn {
  position:absolute; top:7px; left:7px; width:20px; height:20px; border-radius:50%;
  background:transparent; border:none; color:var(--muted); font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity 0.15s;
}
.bottle-card:hover .del-btn { opacity:1; }
.del-btn:hover { color:var(--danger); }

/* AI scan badge on card */
.ai-badge {
  position:absolute; bottom:8px; right:8px; width:20px; height:20px;
  border-radius:50%; background:var(--gold); display:flex; align-items:center;
  justify-content:center; font-size:11px; cursor:pointer; transition:transform 0.15s;
/*  title:'AI scan';*/
}
.ai-badge:hover { transform:scale(1.15); }

/* ── CAMERA PAGE ── */
.camera-page { padding:12px; gap:12px; }
.camera-header { font-family:var(--font-head); font-size:22px; color:var(--gold); letter-spacing:1px; }
.camera-sub { font-size:13px; color:var(--muted); margin-top:2px; margin-bottom:12px; }

.api-setup { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:12px; }
.api-setup label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; display:block; margin-bottom:6px; }
.api-setup input {
  width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
  font-family:var(--font-mono, monospace); font-size:12px; padding:8px 10px; border-radius:6px; outline:none;
}
.api-setup input:focus { border-color:var(--gold); }
.api-setup .hint { font-size:11px; color:var(--muted); margin-top:6px; }
.api-setup .hint a { color:var(--gold); text-decoration:none; }

.bottle-select-bar {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:12px; margin-bottom:12px;
}
.bottle-select-bar label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; display:block; margin-bottom:6px; }
.bottle-select-bar select {
  width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
  font-family:var(--font-body); font-size:14px; padding:8px 10px; border-radius:6px; outline:none;
}
.bottle-select-bar select:focus { border-color:var(--gold); }

.camera-box {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  overflow:hidden; position:relative; aspect-ratio:3/4; margin-bottom:12px;
  display:flex; align-items:center; justify-content:center;
}
#video { width:100%; height:100%; object-fit:cover; display:block; }
#canvas { display:none; }
.camera-overlay {
  position:absolute; inset:0; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
}
.scan-frame {
  width:60%; aspect-ratio:1/3;
  border:2px solid var(--gold); border-radius:8px;
  box-shadow:0 0 0 2000px rgba(0,0,0,0.35);
  position:relative;
}
.scan-frame::before, .scan-frame::after {
  content:''; position:absolute; width:20px; height:20px;
}
.scan-frame::before { top:-2px; left:-2px; border-top:3px solid var(--gold-light); border-left:3px solid var(--gold-light); border-radius:4px 0 0 0; }
.scan-frame::after { bottom:-2px; right:-2px; border-bottom:3px solid var(--gold-light); border-right:3px solid var(--gold-light); border-radius:0 0 4px 0; }
.camera-placeholder {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  color:var(--muted); font-size:13px; text-align:center; padding:20px;
}
.camera-placeholder .big { font-size:48px; }

.cam-controls { display:flex; gap:8px; }
.cam-controls .btn { flex:1; text-align:center; }

/* ── AI RESULT ── */
.ai-result {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:16px; margin-top:12px; display:none;
}
.ai-result.visible { display:block; }
.ai-result-title { font-family:var(--font-head); font-size:18px; color:var(--gold); margin-bottom:10px; }
.ai-result-pct {
  font-family:var(--font-head); font-size:56px; line-height:1; margin-bottom:4px;
}
.ai-result-desc { font-size:13px; color:var(--muted); line-height:1.6; margin-bottom:14px; }
.ai-preview { width:100%; max-height:180px; object-fit:contain; border-radius:6px; margin-bottom:12px; background:var(--bg); }

/* ── SCANNING ANIMATION ── */
.scanning-bar {
  position:absolute; left:20%; right:20%; height:2px; background:var(--gold);
  border-radius:1px; animation:scan 1.5s ease-in-out infinite; display:none;
  box-shadow:0 0 8px var(--gold);
}
.scanning-bar.active { display:block; }
@keyframes scan { 0%{top:20%} 100%{top:80%} }

/* ── SETTINGS PAGE ── */
.settings-page { padding:16px; gap:0; }
.settings-section { margin-bottom:20px; }
.settings-section h3 { font-family:var(--font-head); font-size:18px; color:var(--gold); letter-spacing:1px; margin-bottom:10px; }
.setting-row {
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  padding:12px 14px; display:flex; align-items:center; justify-content:space-between;
  margin-bottom:6px;
}
.setting-row label { font-size:13px; color:var(--text); }
.setting-row span { font-size:12px; color:var(--muted); }
.toggle {
  width:40px; height:22px; border-radius:11px; background:var(--surface);
  border:1px solid var(--border); position:relative; cursor:pointer; transition:background 0.2s;
  flex-shrink:0;
}
.toggle.on { background:var(--gold); border-color:var(--gold); }
.toggle::after {
  content:''; width:16px; height:16px; border-radius:50%; background:var(--muted);
  position:absolute; top:2px; left:2px; transition:transform 0.2s, background 0.2s;
}
.toggle.on::after { transform:translateX(18px); background:white; }

/* ── MODALS ── */
.modal-bg {
  position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200;
  display:flex; align-items:flex-end; justify-content:center;
  padding: 0 0 var(--safe-bot) 0;
}
.modal-bg.hidden { display:none; }
.modal {
  background:var(--card); border:1px solid var(--border); border-radius:16px 16px 0 0;
  padding:24px 20px; width:100%; max-width:480px; max-height:85vh; overflow-y:auto;
}
.modal h2 { font-family:var(--font-head); font-size:24px; color:var(--gold); margin-bottom:18px; letter-spacing:1px; }
.modal label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; display:block; margin-bottom:5px; margin-top:12px; }
.modal input, .modal select {
  width:100%; background:var(--surface); border:1px solid var(--border);
  color:var(--text); font-family:var(--font-body); font-size:14px;
  padding:9px 12px; border-radius:6px; outline:none;
}
.modal input:focus, .modal select:focus { border-color:var(--gold); }
.modal-btns { display:flex; gap:10px; margin-top:20px; }
.modal-btns .btn { flex:1; text-align:center; }

/* ── TOAST ── */
.toast {
  position:fixed; bottom:calc(70px + var(--safe-bot)); left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--card); border:1px solid var(--border); border-radius:8px;
  padding:10px 18px; font-size:13px; color:var(--text); opacity:0;
  transition:all 0.25s; z-index:300; white-space:nowrap; pointer-events:none;
  max-width:90vw; text-align:center;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── EMPTY ── */
.empty-state { grid-column:1/-1; text-align:center; padding:40px 20px; color:var(--muted); }
.empty-state .big { font-family:var(--font-head); font-size:48px; color:rgba(232,168,32,0.2); display:block; margin-bottom:8px; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  flex-shrink:0; display:flex; background:rgba(13,10,8,0.97); border-top:1px solid var(--border);
  padding: 6px 0 calc(6px + var(--safe-bot)); z-index:10;
}
.bnav-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 4px; cursor:pointer; color:var(--muted); transition:color 0.15s;
  font-size:10px; text-transform:uppercase; letter-spacing:0.06em;
}
.bnav-item svg { width:22px; height:22px; }
.bnav-item.active { color:var(--gold); }

/* ── LOADING SPINNER ── */
.spinner {
  width:24px; height:24px; border:2px solid var(--border);
  border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite;
  display:none; margin:0 auto;
}
.spinner.active { display:block; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header>
    <div>
      <div class="logo">BÁR LELTÁR<span>AI standolás</span></div>
      <div id="clock">00:00:00</div>
    </div>
    <div class="header-right">
      <div id="api-indicator" title="Gemini API állapot"></div>
      <button class="icon-btn" onclick="exportData()" title="Exportálás">⬇</button>
    <!-- <button class="icon-btn" onclick="openModal()" title="Új üveg">＋</button>--> 
      <button id="btn-add-bottle" class="icon-btn" title="Új üveg">+</button>
    </div>
  </header>

  <!-- TABS (hidden, used by bottom nav) -->

  <!-- PAGE: LELTÁR -->
  <div class="page active" id="page-leltár">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="toolbar">
      <input type="text" id="search" placeholder="🔍  Keresés...">
      <select id="cat-filter"></select>
      <select id="sort-sel">
        <option value="name">Névsor</option>
        <option value="low">Legüresebb</option>
        <option value="high">Legteltebb</option>
      </select>
    </div>
    <div class="bottles-grid" id="grid"></div>
  </div>

  <!-- PAGE: KAMERA -->
  <div class="page" id="page-kamera">
    <div class="camera-page" style="display:flex;flex-direction:column;">

      <div class="camera-header">AI SZINTMÉRÉS</div>
      <div class="camera-sub">Fotózd le az üveget — az AI megbecsüli a töltöttségi szintet</div>
      <!-- BOTTLE SELECT -->
      <div class="bottle-select-bar">
        <label>Melyik üveghez rendeld az eredményt?</label>
        <select id="scan-bottle-select"><option value="">— válassz üveget —</option></select>
      </div>

      <!-- CAMERA -->
      <div class="camera-box" id="camera-box">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div class="camera-overlay">
          <div class="scan-frame">
            <div class="scanning-bar" id="scanning-bar"></div>
          </div>
        </div>
        <div class="camera-placeholder" id="cam-placeholder">
          <span class="big">📷</span>
          <span>Kamera indításához nyomd meg a gombot</span>
        </div>
      </div>

      <div class="cam-controls">
        <button class="btn sec" id="cam-start-btn" onclick="startCamera()">📷 Kamera</button>
        <button class="btn" id="cam-snap-btn" onclick="snapAndAnalyze()" disabled>🔍 Elemzés</button>
        <button class="btn sec" id="upload-btn" onclick="document.getElementById('file-upload-input').click()">🖼 Kép</button>
        
        <input type="file" id="file-upload-input" accept="image/*" style="display:none">
      </div>

      <!-- AI RESULT -->
      <div class="ai-result" id="ai-result">
        <div class="ai-result-title">AI BECSLÉS</div>
        <img id="ai-preview" class="ai-preview" src="" alt="Beolvasott kép">
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:6px;">
          <div class="ai-result-pct" id="ai-pct-display">—%</div>
          <div id="ai-bottle-name" style="font-family:var(--font-head);font-size:20px;color:var(--muted);letter-spacing:1px;"></div>
        </div>
        <div class="ai-result-desc" id="ai-desc"></div>
        <div class="spinner" id="ai-spinner"></div>
        <div style="display:flex;gap:8px;margin-top:4px;" id="ai-action-btns">
          <button class="btn" onclick="applyAiResult()" id="apply-btn" disabled>✓ Alkalmaz</button>
          <button class="btn sec" onclick="resetScan()">✕ Elvet</button>
        </div>
      </div>

    </div>
  </div>

  <!-- PAGE: BEÁLLÍTÁSOK -->
  <div class="page" id="page-beállítások">
    <div class="settings-page" style="display:flex;flex-direction:column;">

      <div class="settings-section">
        <h3>MEGJELENÍTÉS</h3>
        <div class="setting-row">
          <label>Figyelmeztetés 15% alatt</label>
          <div class="toggle on" id="tog-warn" onclick="toggleSetting('warn')"></div>
        </div>
        <div class="setting-row">
          <label>Törölt üvegek visszaállítása</label>
          <button class="btn sec" onclick="restoreDefault()">Alapértelmezés</button>
        </div>
      </div>

      <div class="settings-section">
        <h3>ADATOK</h3>
        <div class="setting-row">
          <div>
            <label>Üvegek száma</label>
            <span id="s-count">—</span>
          </div>
          <button class="btn sec" onclick="exportData()">CSV export</button>
        </div>
        <div class="setting-row">

function filteredSorted() {
  const q = (document.getElementById('search').value||'').toLowerCase();
  const cat = document.getElementById('cat-filter').value;
  const sort = document.getElementById('sort-sel').value;
  let list = bottles.filter(b =>
    (!q || b.name.toLowerCase().includes(q) || b.cat.toLowerCase().includes(q)) &&
    (!cat || b.cat === cat)
  );
  if (sort === 'low') list.sort((a,b)=>a.pct-b.pct);
  else if (sort === 'high') list.sort((a,b)=>b.pct-a.pct);
  else list.sort((a,b)=>a.name.localeCompare(b.name,'hu'));
  return list;
}

function render() {

  bottles.forEach(b => {
    if (!b.cat) {
      b.cat = b.name ? b.name.split(' ')[0] : 'Egyéb';
    }
  });
  const list = filteredSorted();
  const cf = document.getElementById('cat-filter');
  const prev = cf ? cf.value : '';
  const cats = [...new Set(bottles.map(b=>b.cat))].sort();
  //cf.innerHTML = '<option value="">Összes</option>' + cats.map(c=>`<option ${c===prev?'selected':''}>${c}</option>`).join('');
  if (cf) {
    cf.innerHTML = '<option value="">Összes</option>' + 
      cats.map(c => `<option ${c === prev ? 'selected' : ''}>${c}</option>`).join('');
  }
  const grid = document.getElementById('grid');
  if (!grid) return;
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><span class="big">🍾</span>Nincs találat</div>`;
    if (typeof renderStats === "function") renderStats(); 
    return;
  }

  grid.innerHTML = list.map(b => {
    const cl = Math.round(b.size *(b.pct || 0) / 100);
    const safeId = b.id;
    return `<div class="bottle-card ${statusClass(b.pct)}" onclick="startEdit(${b.id})">

      </div>
      <div class="vol-display">~<strong>${cl} cl</strong> / ${b.size} cl</div>
      <div class="adj-row">

        <button class="adj-btn" onclick="event.stopPropagation();adj(${safeId},5)">+</button>
      </div>
      <div class="ai-badge" onclick="event.stopPropagation();quickScan('${safeId}')" title="AI scan">🤖</div>
    </div>`;
  }).join('');
  renderStats();
}

function renderStats() {
  const total = bottles.length;
  const low = bottles.filter(b=>b.pct<=15).length;
  const warn = bottles.filter(b=>b.pct>15&&b.pct<=30).length;
  const avg = total ? Math.round(bottles.reduce((s,b)=>s+b.pct,0)/total) : 0;
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><div class="stat-val">${total}</div><div class="stat-label">Üveg</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--danger)">${low}</div><div class="stat-label">Kritikus</div></div>

}

async function startCamera() {
  try {
    if (cameraStream) { cameraStream.getTracks().forEach(t=>t.stop()); }
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width:{ideal:1280}, height:{ideal:720} }
    });
    const video = document.getElementById('video');
    video.srcObject = cameraStream;
    video.style.display = 'block';
    document.getElementById('cam-placeholder').style.display = 'none';
    document.getElementById('cam-snap-btn').disabled = false;
    document.getElementById('cam-start-btn').textContent = '⏹ Stop';
    document.getElementById('cam-start-btn').onclick = stopCamera;
  } catch(e) {
    showToast('❌ Kamera nem elérhető: ' + e.message);
  }
}

window.startCamera = startCamera;

function stopCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
  document.getElementById('video').style.display = 'none';
  document.getElementById('cam-placeholder').style.display = 'flex';
  document.getElementById('cam-snap-btn').disabled = true;
  document.getElementById('cam-start-btn').textContent = '📷 Kamera';
  document.getElementById('cam-start-btn').onclick = startCamera;
}

window.stopCamera = stopCamera;

function snapAndAnalyze() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const max_size = 800;
  let width = video.videoWidth || 640;
  let height = video.videoHeight || 480;
  
  if (width > height) {
    if (width > max_size) {
      height *= max_size / width;
      width = max_size;
    }
  } else {
    if (height > max_size) {
      width *= max_size / height;
      height = max_size;
    }
  }
  
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(video, 0, 0, width, height);
  const base64 = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
  const bottleId = parseInt(document.getElementById('scan-bottle-select').value) || null;
  analyzeImage(base64, bottleId);
}

function handleFileUpload(e) {
  window.isAnalyzing = false; 
  const file = e.target.files[0];
  const reader = new FileReader();

reader.onload = ev => {
  const result = ev.target.result;
  
  // 1. Ellenőrizzük, hogy egyáltalán sikerült-e beolvasni a fájlt
  if (!result) {
    console.error("A FileReader üres eredményt adott vissza! A fájl sérült vagy túl nagy.");
    return;
  }

  // 2. Biztonságos Base64 kinyerés: levágjuk a 'data:*/*;base64,' részt, ha létezik
  let base64 = "";
  if (result.includes(',')) {
    base64 = result.split(',')[1];
  } else {
    base64 = result; // Ha valamiért nincs benne vessző, a teljes stringet használjuk

// Segédfüggvény: A kamera Base64 képét átalakítja bináris Blob formátummá
function base64ToBlob(base64Data, contentType = 'image/jpeg') {
  let pureBase64 = base64Data;
  if (base64Data.includes(',')) {
      pureBase64 = base64Data.split(',')[1];
  }
  const byteCharacters = atob(pureBase64);
  const byteArrays = [];
  for (let offset = 0; offset < byteCharacters.length; offset += 512) {
      const slice = byteCharacters.slice(offset, offset + 512);
      const byteNumbers = new Array(slice.length);
      for (let i = 0; i < slice.length; i++) {
          byteNumbers[i] = slice.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      byteArrays.push(byteArray);
  }
  return new Blob(byteArrays, { type: contentType });
}
window.isAnalyzing = false;
// AZ ÚJ ELEMZŐ FÜGGVÉNY - A RÉGI HELYÉRE
async function analyzeImage(base64Image, bottleId) {
  
if (window.isAnalyzing) return null;
    
// Lecsukjuk a sorompót
window.isAnalyzing = true; 
const resultBox = document.getElementById('ai-result');
  const spinner = document.getElementById('ai-spinner');
  const pctDisplay = document.getElementById('ai-pct-display');
  const descEl = document.getElementById('ai-desc');
  const preview = document.getElementById('ai-preview');
  const applyBtn = document.getElementById('apply-btn');
  const scanBar = document.getElementById('scanning-bar');
  const actionBtns = document.getElementById('ai-action-btns');

  resultBox.classList.add('visible');
  spinner.classList.add('active');
  scanBar.classList.add('active');
  pctDisplay.textContent = '…';
  descEl.textContent = 'Az AI elemzi a képet…';
  applyBtn.disabled = true;
  actionBtns.style.display = 'none';
  preview.src = 'data:image/jpeg;base64,' + base64Image;
  aiResult = null;

  if (pctDisplay) {
      pctDisplay.textContent = '⏳...';
      pctDisplay.style.color = '#718096'; 
  }

  try {
      // 1. Kép átalakítása Blob formátummá
      const imageBlob = base64ToBlob(base64Image, 'image/jpeg');

      // 2. FormData összeállítása a FastAPI szerverhez
      const formData = new FormData();
      formData.append("bottle_id", bottleId);
      formData.append("image", imageBlob, "stand_capture.jpg");
      //https://ocsi66-ingatlan.hf.space/api/estimate
      // 3. Kérés a saját szerverre
      // "https://ocsi66-deep-stand.hf.space/api/predict-level"
      const response = await fetch("https://ocsi66-deep-stand.hf.space/api/predict-level", {
          method: "POST",
          body: formData
      });

      if (!response.ok) {
          throw new Error(`Szerver hiba: ${response.status}`);
      }

      const data = await response.json();
      
      if (data.status === "success") {
          const currentPct = Math.max(0, Math.min(100, data.percentage));

          // 4. Adatok előkészítése a háttérben a 'bottles' tömböz
          const bottleIndex = bottles.findIndex(b => b.id === bottleId || b.id == bottleId);
          
          if (bottleIndex !== -1) {
              const totalVolume = bottles[bottleIndex].size;
              const currentCl = (totalVolume * (currentPct / 100)).toFixed(1);
              
              // 🚨 EZ A LEGFONTOSABB: Beállítjuk a globális aiResult objektumot, amit a te Alkalmaz gombod keres!
              aiResult = { pct: currentPct, cl: currentCl, bottleId: bottleId };
              
              console.log(`Saját AI eredmény elmentve a memóriába: ${currentPct}% (${currentCl} cl)`);
          } else {
              // Ha az ID formátuma eltér (pl. string vs szám), biztonsági mentésként közvetlenül is kiszámoljuk
              aiResult = { pct: currentPct, cl: 0, bottleId: bottleId };
          }

          // 5. A TE EREDETI KIJELZŐD FRISSÍTÉSE
          if (pctDisplay) {
              pctDisplay.textContent = currentPct + '%';
              // Beállítjuk a színét (vagy kézzel, ha a statusColor hiányzik)
              if (typeof statusColor === "function") {
                  pctDisplay.style.color = statusColor(currentPct);
              } else {
                  pctDisplay.style.color = '#2B6CB0'; // szép kék szín
              }
          }
          
          if (descEl) {
              descEl.textContent = "Saját gépi látás modell alapján mérve.";
          }

          // Üveg nevének kiírása, ha van ilyen meződ
          const bName = bottleId ? (bottles.find(b => b.id === bottleId || b.id == bottleId) || { name: '' }).name : '';
          const bottleNameEl = document.getElementById('ai-bottle-name');
          if (bottleNameEl) {
              bottleNameEl.textContent = bName;
          }

          // 6. GOMBOK AKTIVÁLÁSA
          if (applyBtn) {
              applyBtn.disabled = false; // Feloldjuk a tiltást
              applyBtn.removeAttribute('disabled');
          }
          
          if (actionBtns) {
              actionBtns.style.setProperty('display', 'flex', 'important'); // Megjelenítjük a gombokat
          }

          // API jelző zöldre állítása
          const apiIndicator = document.getElementById('api-indicator');
          if (apiIndicator) apiIndicator.className = 'ok';
          
          if (typeof showToast === "function") {
              showToast('✓ AI becslés kész: ' + currentPct + '%');
          }

          return aiResult;
      } else {
          throw new Error(data.error || "Ismeretlen szerveroldali hiba.");
      }

  } catch (error) {
      console.error("Hiba az elemzés során:", error);
      if (pctDisplay) {
          pctDisplay.textContent = "Hiba ❌";
          pctDisplay.style.color = "#E53E3E";
      }
      window.isAnalyzing = false; 
      return null;
  }
}

  function applyAiResult() {
    if (!aiResult || !aiResult.bottleId) return;
    const b = bottles.find(x=>x.id===aiResult.bottleId);
    if (!b) return;
    const scanBar = document.getElementById('scanning-bar');
    if (scanBar) {
        scanBar.classList.remove('active');
    }
    // 1. Beírjuk az AI által mért százalékot
    b.pct = aiResult.pct;
    
    // 🚨 AZ EGYETLEN ÚJ SOR: Kiszámoljuk a pontos cl értéket is az üveg mérete (b.size) alapján!
    // Például: 70 cl * (64 / 100) = 45 cl (Kerekítve, hajszálpontosan 1 cl-es pontossággal)
    b.currentCl = Math.round(b.size * (aiResult.pct / 100));

    save(); 
    render();
    
    // 3. Felugró üzenet és a felület tiszta lappal való visszaállítása
    showToast(`✓ ${b.name}: ${b.pct}% alkalmazva`);
    resetScan();
    switchPage('leltár');
  }

function exportData() {
  const rows = [['Név','Kategória','Méret (cl)','Szint (%)','Tartalom (cl)','Állapot']];
  bottles.forEach(b => {
    const cl = Math.round(b.size*b.pct/100);
    const status = b.pct<=15?'Kritikus':b.pct<=30?'Figyelj rá':'OK';
    rows.push([b.name, b.cat, b.size, b.pct, cl, status]);
  });
  const csv = rows.map(r=>r.join(';')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('\uFEFF'+csv);
  a.download = 'bar_leltár_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  showToast('✓ CSV exportálva');
}

function updateClock() {
  const now = new Date();
  
  // Óra, perc, másodperc kinyerése és kétjegyűvé alakítása
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');
  
  // A string összefűzése
  const timeString = `${hours}:${minutes}:${seconds}`;
  
  // Az érték beillesztése a HTML-be
  const clockElement = document.getElementById('clock');
  if (clockElement) {
    clockElement.textContent = timeString;
  }
}
